# If CI push fails with `write_package`: repo Settings → Actions → General →
# Workflow permissions → **Read and write permissions**. Or add org secret
# `GHCR_TOKEN` (PAT with write:packages) and use it in docker-fork.yml instead of GITHUB_TOKEN.
# VPS never compiles Go — only `docker compose pull`.
name: Docker fork image

on:
  push:
    branches:
      - fork/main
    paths-ignore:
      - "**.md"
      - LICENSE
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/release-drafter.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit tag (e.g. 0.1.157-fork.4). Default: <version>-<short-sha>"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Image tags
        id: meta
        run: |
          BASE=$(grep 'Version' version.go | sed -n 's/.*"\([^"]*\)".*/\1/p')
          SHORT="${GITHUB_SHA::7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${BASE}-${SHORT}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/tork:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/tork:fork-main

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- \`ghcr.io/${{ steps.meta.outputs.owner }}/tork:${{ steps.meta.outputs.tag }}\`"
            echo "- \`ghcr.io/${{ steps.meta.outputs.owner }}/tork:fork-main\` (rolling latest on fork/main)"
            echo ""
            echo "VPS: set \`TORK_IMAGE_TAG\` in \`/opt/automation/tork/.env\`, then pull + up."
          } >> "$GITHUB_STEP_SUMMARY"
